name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase so the free project is not paused
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_2WTInwTxkSieQGgRRV03Qw_6ETIRwyF" \
            "https://vsvcffrxzeirzlaqozmo.supabase.co/rest/v1/profiles?select=user_id&limit=1")
          echo "Supabase responded with $code"
          test "$code" = "200"
